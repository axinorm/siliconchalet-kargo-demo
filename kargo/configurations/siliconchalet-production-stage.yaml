apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: production
  namespace: siliconchalet
spec:
  requestedFreight:
  - origin:
      kind: Warehouse
      name: siliconchalet-app
    sources:
      stages:
      - testing
  promotionTemplate:
    spec:
      vars:
      - name: repoURL
        value: ${REPOSITORY_URL}
      - name: imageRepo
        value: public.ecr.aws/nginx/nginx
      steps:
      - uses: git-clone
        config:
          repoURL: ${{ vars.repoURL }}
          checkout:
          - branch: main
            path: ./repo
      - uses: yaml-update
        as: update-image
        config:
          path: ./repo/values-${{ ctx.stage }}.yaml
          updates:
          - key: image.tag
            value: ${{ imageFrom(vars.imageRepo).Tag }}
      - uses: git-commit
        as: commit
        config:
          path: ./repo
          message: ${{ outputs['update-image'].commitMessage }}
      # Pushing into a dynamically generated branch
      - uses: git-push
        as: push
        config:
          path: ./repo
          generateTargetBranch: true
      # Creating a Pull Request
      - uses: git-open-pr
        as: open-pr
        config:
          provider: github
          repoURL: ${{ vars.repoURL }}
          sourceBranch: ${{ outputs.push.branch }}
          targetBranch: main
      # Waiting until merge
      - uses: git-wait-for-pr
        as: wait-for-pr
        config:
          provider: github
          repoURL: ${{ vars.repoURL }}
          prNumber: ${{ outputs['open-pr'].pr.id }}
      - uses: argocd-update
        config:
          apps:
          - name: siliconchalet-app-${{ ctx.stage }}
            sources:
            - repoURL: ${{ vars.repoURL }}
              desiredRevision: ${{ outputs['wait-for-pr'].commit }}
