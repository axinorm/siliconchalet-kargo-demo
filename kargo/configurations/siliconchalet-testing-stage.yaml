apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: testing
  namespace: siliconchalet
spec:
  requestedFreight:
  - origin:
      kind: Warehouse
      name: siliconchalet-app
    sources:
      stages:
      - development
  promotionTemplate:
    spec:
      steps:
      - task:
          name: promote-helm-app
          kind: PromotionTask
        vars:
        - name: repoURL
          value: ${REPOSITORY_URL}
